# Cheapest possible probe of the one thing Route B is actually uncertain about:
# will EAS Build run a repo that has an Xcode project but no React Native, no
# native `ios/` directory, and no app JavaScript?
#
# Run this BEFORE wiring up credentials:
#   npx eas-cli@latest build -p ios -e smoke
#
# If it fails, Route B is dead and we keep Route A rather than sinking more
# time into the scaffold. Deliberately no credentials — the profile sets
# withoutCredentials, so this cannot touch the Apple account.
build:
  name: Smoke test — native project, no React Native
  steps:
    - eas/checkout

    - run:
        name: Builder environment
        command: |
          xcodebuild -version
          swift --version
          echo "--- repo root ---"
          ls -la

    # The whole Route B strategy rests on this: EAS expects the Xcode project
    # under ./ios, but Been There keeps WorldTracker.xcodeproj at the repo
    # root. Symlinking the root as ./ios presents it as a prebuilt iOS project
    # without moving anything or touching the hand-authored pbxproj.
    - run:
        name: Expose the Xcode project as ./ios
        command: |
          ln -sf . ios
          ls -la ios/WorldTracker.xcodeproj

    # Compile unsigned. Same invocation as .github/workflows/ios-build.yml, so
    # a failure here is an EAS-environment problem, not a code problem.
    - run:
        name: Unsigned compile
        command: |
          xcodebuild \
            -project WorldTracker.xcodeproj \
            -scheme WorldTracker \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

    - run:
        name: Project invariants
        command: python3 Tools/validate_project.py
