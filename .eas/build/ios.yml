# Route B: App Store archive on EAS Build.
#
# Only worth running once .eas/build/smoke.yml has gone green — that profile
# proves the environment works before this one spends Apple credentials on it.
#
#   npx eas-cli@latest build -p ios -e production
#
# Unlike Route A (raw xcodebuild + App Store Connect API key), this leans on
# EAS-managed credentials: EAS detects the BeenThereWidgets app extension from
# the Xcode project and generates a provisioning profile for its separate
# `.widgets` bundle id alongside the app's. That auto-handling of the second
# target is the one place this route may genuinely beat Route A.
build:
  name: Been There — App Store archive
  steps:
    - eas/checkout

    # Installs the `expo` package from the shim package.json. Been There ships
    # no JavaScript; this exists only so the EAS build functions below have the
    # project context they expect.
    - eas/install_node_modules

    # See smoke.yml — EAS looks for the Xcode project under ./ios.
    - run:
        name: Expose the Xcode project as ./ios
        command: ln -sf . ios

    # Resolves the scheme and build configuration from the Xcode project.
    # Requires WorldTracker.xcscheme to be a *shared* scheme — it is, and
    # Tools/validate_project.py enforces that it stays committed.
    - eas/resolve_build_config

    # Sets CFBundleVersion from EAS's remote version source, so TestFlight
    # never sees a duplicate build number. Pairs with "appVersionSource":
    # "remote" and "autoIncrement": true in eas.json.
    - eas/configure_ios_version

    # Installs the distribution certificate and assigns provisioning profiles
    # to *both* targets (WorldTracker + BeenThereWidgets).
    - eas/configure_ios_credentials:
        inputs:
          build_configuration: Release

    - eas/generate_gymfile_from_template:
        inputs:
          scheme: WorldTracker
          configuration: Release

    - eas/run_fastlane

    - eas/find_and_upload_build_artifacts
